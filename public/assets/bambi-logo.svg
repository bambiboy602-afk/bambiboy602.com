<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&amp;family=Montserrat:wght@500;600;700;800&amp;family=Caveat:wght@600&amp;display=swap');
      .title { font-family: 'Playfair Display', Georgia, serif; font-weight: 900; letter-spacing: 0.18em; fill: #0D4A32; }
      .sub { font-family: 'Montserrat', system-ui, sans-serif; font-weight: 700; letter-spacing: 0.24em; fill: #492066; }
      .values { font-family: 'Montserrat', system-ui, sans-serif; font-weight: 600; letter-spacing: 0.14em; fill: #0D4A32; font-size: 11.5px; }
      .script { font-family: 'Caveat', cursive, sans-serif; font-weight: 600; font-size: 26px; fill: #0D4A32; }
      .ring-text { font-family: 'Montserrat', system-ui, sans-serif; font-weight: 800; letter-spacing: 0.18em; font-size: 13px; }
    </style>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="600" height="640" fill="#FFFFFF" rx="24"/>

  <!-- Interlocking Rings Group -->
  <g transform="translate(300, 200)" filter="url(#softShadow)">
    <!-- Ring 1: TOP GREEN (SEEKING) -->
    <circle cx="0" cy="-62" r="76" fill="none" stroke="#0D4A32" stroke-width="20" stroke-linecap="round" />
    <!-- Ring 2: BOTTOM LEFT PURPLE (LISTENING) -->
    <circle cx="-56" cy="38" r="76" fill="none" stroke="#492066" stroke-width="20" stroke-linecap="round" />
    <!-- Ring 3: BOTTOM RIGHT GOLD (HELPING) -->
    <circle cx="56" cy="38" r="76" fill="none" stroke="#BA7810" stroke-width="20" stroke-linecap="round" />

    <!-- Center heart in the intersection -->
    <path d="M 0, -2 C -5, -12 -18, -8 -18, 4 C -18, 14 0, 22 0, 22 C 0, 22 18, 14 18, 4 C 18, -8 5, -12 0, -2 Z" fill="#492066"/>

    <!-- TOP CIRCLE CONTENT (SEEKING) -->
    <!-- Curved text SEEKING -->
    <path id="curveSeeking" d="M -50,-88 A 76,76 0 0,1 50,-88" fill="none" />
    <text class="ring-text" fill="#FFFFFF" text-anchor="middle">
      <textPath href="#curveSeeking" startOffset="50%">SEEKING</textPath>
    </text>
    <!-- Figure seeking/sitting with heart thought bubble -->
    <g transform="translate(0, -68)">
      <!-- Head -->
      <circle cx="-5" cy="-8" r="7" fill="#0D4A32"/>
      <!-- Body tucked in thought -->
      <path d="M -14, 12 C -14, 0 4, 0 6, 12 C 6, 15 -14, 15 -14, 12 Z" fill="#0D4A32"/>
      <!-- Knees up -->
      <circle cx="6" cy="6" r="4" fill="#0D4A32"/>
      <!-- Heart thought bubble -->
      <path d="M 12,-16 C 9,-21 3,-18 3,-13 C 3,-8 12,-4 12,-4 C 12,-4 21,-8 21,-13 C 21,-18 15,-21 12,-16 Z" fill="#0D4A32"/>
    </g>

    <!-- LEFT CIRCLE CONTENT (LISTENING) -->
    <path id="curveListening" d="M -115,50 A 76,76 0 0,0 -40,118" fill="none" />
    <text class="ring-text" fill="#FFFFFF" text-anchor="middle">
      <textPath href="#curveListening" startOffset="50%">LISTENING</textPath>
    </text>
    <!-- Ear icon with sound waves -->
    <g transform="translate(-56, 38)">
      <!-- Ear -->
      <path d="M -4,-16 C 6,-16 12,-10 12,0 C 12,8 6,14 -2,16 C -6,17 -8,13 -6,9 C -4,5 4,5 4,0 C 4,-7 -1,-9 -4,-9 C -8,-9 -8,-16 -4,-16 Z" fill="#492066"/>
      <!-- Sound waves -->
      <path d="M -15,-6 A 12,12 0 0,0 -15,6" fill="none" stroke="#492066" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M -21,-12 A 20,20 0 0,0 -21,12" fill="none" stroke="#492066" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- RIGHT CIRCLE CONTENT (HELPING) -->
    <path id="curveHelping" d="M 40,118 A 76,76 0 0,0 115,50" fill="none" />
    <text class="ring-text" fill="#FFFFFF" text-anchor="middle">
      <textPath href="#curveHelping" startOffset="50%">HELPING</textPath>
    </text>
    <!-- Two figures helping up steps -->
    <g transform="translate(56, 38)">
      <!-- Steps -->
      <path d="M -14,14 L -2,14 L -2,6 L 14,6" fill="none" stroke="#BA7810" stroke-width="3" stroke-linecap="round"/>
      <!-- Person being helped (left/lower) -->
      <circle cx="-8" cy="-2" r="4.5" fill="#BA7810"/>
      <path d="M -12,12 L -6,4 L 0,2" fill="none" stroke="#BA7810" stroke-width="3" stroke-linecap="round"/>
      <!-- Person helping (right/higher) -->
      <circle cx="8" cy="-12" r="5" fill="#BA7810"/>
      <path d="M 8,-6 L 8,4 L 14,8" fill="none" stroke="#BA7810" stroke-width="3" stroke-linecap="round"/>
      <path d="M 8,-3 L 0,2" fill="none" stroke="#BA7810" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Typography Block -->
  <g transform="translate(300, 390)">
    <!-- B.A.M.B.I. Letters with colored dots -->
    <text class="title" x="0" y="30" font-size="50" text-anchor="middle">
      B<tspan fill="#492066">.</tspan>A<tspan fill="#BA7810">.</tspan>M<tspan fill="#BA7810">.</tspan>B<tspan fill="#492066">.</tspan>I<tspan fill="#0D4A32">.</tspan>
    </text>

    <!-- Subtitle -->
    <text class="sub" x="0" y="68" font-size="17" text-anchor="middle">
      PEER SUPPORT SERVICES
    </text>

    <!-- Values Row -->
    <text class="values" x="0" y="105" text-anchor="middle">
      BELONGING <tspan fill="#492066">•</tspan> ACCEPTANCE <tspan fill="#BA7810">•</tspan> MEANING <tspan fill="#0D4A32">•</tspan> BALANCE <tspan fill="#492066">•</tspan> INSPIRATION
    </text>

    <!-- Divider lines with center heart -->
    <g transform="translate(0, 126)">
      <line x1="-230" y1="0" x2="-22" y2="0" stroke="#BA7810" stroke-width="1.5"/>
      <path d="M 0, -5 C -3, -11 -10, -8 -10, 0 C -10, 7 0, 12 0, 12 C 0, 12 10, 7 10, 0 C 10, -8 3, -11 0, -5 Z" fill="#492066"/>
      <line x1="22" y1="0" x2="230" y2="0" stroke="#BA7810" stroke-width="1.5"/>
    </g>

    <!-- Script Tagline -->
    <text class="script" x="0" y="168" text-anchor="middle">
      No judgment. No lectures. Just people helping people.
    </text>
  </g>
</svg>
