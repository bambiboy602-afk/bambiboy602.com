<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&amp;family=Montserrat:wght@500;600;700;800&amp;family=Caveat:wght@600&amp;display=swap');
      .title { font-family: 'Playfair Display', Georgia, serif; font-weight: 900; letter-spacing: 0.18em; fill: #0D4A32; }
      .sub { font-family: 'Montserrat', system-ui, sans-serif; font-weight: 700; letter-spacing: 0.26em; fill: #492066; }
      .values { font-family: 'Montserrat', system-ui, sans-serif; font-weight: 600; letter-spacing: 0.14em; fill: #0D4A32; font-size: 11.5px; }
      .script { font-family: 'Caveat', cursive, sans-serif; font-weight: 600; font-size: 25px; fill: #0D4A32; }
      .ring-text { font-family: 'Montserrat', system-ui, sans-serif; font-weight: 800; letter-spacing: 0.18em; font-size: 12.5px; }
    </style>
    <filter id="widescreenDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="800" height="450" fill="#FFFFFF" rx="16"/>

  <!-- Interlocking Rings Group -->
  <g transform="translate(400, 140)" filter="url(#widescreenDropShadow)">
    <!-- Ring 1: TOP GREEN (SEEKING) -->
    <circle cx="0" cy="-56" r="64" fill="none" stroke="#0D4A32" stroke-width="17" stroke-linecap="round" />
    <!-- Ring 2: BOTTOM LEFT PURPLE (LISTENING) -->
    <circle cx="-48" cy="30" r="64" fill="none" stroke="#492066" stroke-width="17" stroke-linecap="round" />
    <!-- Ring 3: BOTTOM RIGHT GOLD (HELPING) -->
    <circle cx="48" cy="30" r="64" fill="none" stroke="#BA7810" stroke-width="17" stroke-linecap="round" />

    <!-- Center heart in the triple intersection -->
    <path d="M 0, -4 C -4, -12 -15, -9 -15, 2 C -15, 11 0, 18 0, 18 C 0, 18 15, 11 15, 2 C 15, -9 4, -12 0, -4 Z" fill="#492066"/>

    <!-- TOP CIRCLE CONTENT (SEEKING) -->
    <!-- Curved text SEEKING -->
    <path id="curveSeeking" d="M -44,-78 A 64,64 0 0,1 44,-78" fill="none" />
    <text class="ring-text" fill="#FFFFFF" text-anchor="middle">
      <textPath href="#curveSeeking" startOffset="50%">SEEKING</textPath>
    </text>
    <!-- Figure seeking/seated facing right with heart thought bubble -->
    <g transform="translate(0, -60)">
      <!-- Head -->
      <circle cx="-4" cy="-8" r="6" fill="#0D4A32"/>
      <!-- Body tucked in thought -->
      <path d="M -12, 10 C -12, 0 3, 0 5, 10 C 5, 13 -12, 13 -12, 10 Z" fill="#0D4A32"/>
      <!-- Knees drawn up -->
      <circle cx="5" cy="5" r="3.5" fill="#0D4A32"/>
      <!-- Heart thought bubble -->
      <path d="M 11,-15 C 8,-19 3,-16 3,-12 C 3,-8 11,-4 11,-4 C 11,-4 19,-8 19,-12 C 19,-16 14,-19 11,-15 Z" fill="#0D4A32"/>
    </g>

    <!-- LEFT CIRCLE CONTENT (LISTENING) -->
    <path id="curveListening" d="M -98,40 A 64,64 0 0,0 -34,98" fill="none" />
    <text class="ring-text" fill="#FFFFFF" text-anchor="middle">
      <textPath href="#curveListening" startOffset="50%">LISTENING</textPath>
    </text>
    <!-- Ear icon with sound waves -->
    <g transform="translate(-48, 30)">
      <!-- Ear in profile -->
      <path d="M -3,-14 C 5,-14 10,-9 10,0 C 10,7 5,12 -2,14 C -5,15 -7,11 -5,8 C -3,4 3,4 3,0 C 3,-6 -1,-8 -3,-8 C -7,-8 -7,-14 -3,-14 Z" fill="#492066"/>
      <!-- Sound waves -->
      <path d="M -13,-5 A 10,10 0 0,0 -13,5" fill="none" stroke="#492066" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M -18,-10 A 17,17 0 0,0 -18,10" fill="none" stroke="#492066" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- RIGHT CIRCLE CONTENT (HELPING) -->
    <path id="curveHelping" d="M 34,98 A 64,64 0 0,0 98,40" fill="none" />
    <text class="ring-text" fill="#FFFFFF" text-anchor="middle">
      <textPath href="#curveHelping" startOffset="50%">HELPING</textPath>
    </text>
    <!-- Two figures helping up steps -->
    <g transform="translate(48, 30)">
      <!-- Steps -->
      <path d="M -12,12 L -2,12 L -2,5 L 12,5" fill="none" stroke="#BA7810" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Person being helped (lower/left) -->
      <circle cx="-7" cy="-2" r="4" fill="#BA7810"/>
      <path d="M -10,10 L -5,3 L 0,1" fill="none" stroke="#BA7810" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Person helping (higher/right) -->
      <circle cx="7" cy="-10" r="4.5" fill="#BA7810"/>
      <path d="M 7,-5 L 7,3 L 12,7" fill="none" stroke="#BA7810" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 7,-2 L 0,1" fill="none" stroke="#BA7810" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Typography Block -->
  <g transform="translate(400, 260)">
    <!-- B.A.M.B.I. Letters with colored dots -->
    <text class="title" x="0" y="36" font-size="44" text-anchor="middle">
      B<tspan fill="#492066">.</tspan>A<tspan fill="#BA7810">.</tspan>M<tspan fill="#BA7810">.</tspan>B<tspan fill="#492066">.</tspan>I<tspan fill="#0D4A32">.</tspan>
    </text>

    <!-- Subtitle: PEER SUPPORT SERVICES -->
    <text class="sub" x="0" y="66" font-size="15.5" text-anchor="middle">
      PEER SUPPORT SERVICES
    </text>

    <!-- Values Row -->
    <text class="values" x="0" y="97" text-anchor="middle">
      BELONGING <tspan fill="#492066">•</tspan> ACCEPTANCE <tspan fill="#BA7810">•</tspan> MEANING <tspan fill="#0D4A32">•</tspan> BALANCE <tspan fill="#492066">•</tspan> INSPIRATION
    </text>

    <!-- Divider lines with center heart -->
    <g transform="translate(0, 116)">
      <line x1="-240" y1="0" x2="-22" y2="0" stroke="#BA7810" stroke-width="1.2"/>
      <path d="M 0, -4 C -3, -9 -9, -7 -9, 0 C -9, 6 0, 10 0, 10 C 0, 10 9, 6 9, 0 C 9, -7 3, -9 0, -4 Z" fill="#492066"/>
      <line x1="22" y1="0" x2="240" y2="0" stroke="#BA7810" stroke-width="1.2"/>
    </g>

    <!-- Script Tagline -->
    <text class="script" x="0" y="152" text-anchor="middle">
      No judgment. No lectures. Just people helping people.
    </text>
  </g>
</svg>
